
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Crisis & Safety</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Campus Crisis & Intelligence Safety</h1>
    <p>Helping build a safer campus for everyone.</p>
  </header>

  <main>
    <section>
      <h2>Safety Dashboard</h2>
      <p>Total incidents reported: <strong id="total">0</strong></p>
    </section>

    <section>
      <h2>Report an Incident</h2>
      <form id="incidentForm">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="">Select category</option>
          <option>Emergency</option>
          <option>Safety Hazard</option>
          <option>Suspicious Activity</option>
          <option>Other</option>
        </select>

        <label for="location">Location</label>
        <input id="location" required placeholder="Incident location">

        <label for="severity">Severity</label>
        <select id="severity" required>
          <option value="">Select severity</option>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
          <option>Critical</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" required></textarea>

        <button type="submit">Submit Incident</button>
      </form>
    </section>

    <section>
      <h2>Reported Incidents</h2>
      <ul id="incidentList"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
